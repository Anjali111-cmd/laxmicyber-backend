<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script>if(sessionStorage.getItem('adminLoggedIn')!=='true')location.replace('login.html')</script>
</head>
<body class="gray">
  <nav>
    <b>🛡️ CyberGuard <span>AI</span></b>
    <button onclick="logout()">Logout</button>
  </nav>

  <main class="dashboard">
    <h1>Complaint Dashboard</h1>
    <p class="muted">Manage and monitor complaints.</p>
    
    <div class="stats">
      <div>Total<br><b id="total">0</b></div>
      <div>High Priority<br><b id="high">0</b></div>
      <div>Under Review<br><b id="review">0</b></div>
      <div>Resolved<br><b id="resolved">0</b></div>
    </div>

    <div class="charts">
      <div><h3>Category Overview</h3><canvas id="categoryChart"></canvas></div>
      <div><h3>Status Overview</h3><canvas id="statusChart"></canvas></div>
    </div>

    <div class="management">
      <h2>Complaint Management</h2>
      <div class="filters">
        <input id="search" placeholder="Search ID or complaint">
        <select id="category">
          <option>All</option>
          <option>UPI / Financial Fraud</option>
          <option>Phishing</option>
          <option>Account Hacking</option>
          <option>Social Media Fraud</option>
          <option>Other</option>
        </select>
        <select id="priority">
          <option>All</option>
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
        <select id="status">
          <option>All</option>
          <option>Registered</option>
          <option>Under Review</option>
          <option>Resolved</option>
        </select>
        <button onclick="resetFilters()">Reset</button>
      </div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Complaint</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Files</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="complaintTable"></tbody>
        </table>
      </div>
      <button class="danger" onclick="clearAll()">🗑️ Clear All</button>
    </div>
  </main>

  <div id="modal" class="modal">
    <div class="modalbox">
      <button class="close" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="admin.js"></script>
</body>
</html>
